[package]
name = "archr-core"
version = "0.4.0"
edition = "2021"
description = "Headless ArchiMate 3.2 engine - validate, manipulate, and export models via CLI"
license = "MIT"
repository = "https://github.com/haquiticos/archr"
homepage = "https://github.com/haquiticos/archr"
keywords = ["archimate", "architecture", "cli", "validation", "modeling"]
categories = ["command-line-utilities", "development-tools"]
rust-version = "1.74"
exclude = [
    "tests/",
    "docs/",
    "skill/",
]

[[bin]]
name = "archr"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"
quick-xml = { version = "0.31", features = ["serialize"] }
clap = { version = "=4.5.11", features = ["derive"] }
petgraph = "0.6"
uuid = { version = "1.6", features = ["v4", "serde"] }
thiserror = "1.0"
