<svg width="100%" height="100%" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" style="fill-rule:evenodd;clip-rule:evenodd;stroke-linejoin:round;stroke-miterlimit:1.5;">
  <!-- archr: stacked architectural layers with connecting lines -->
  <rect x="80"  y="60"  width="240" height="36" rx="3" fill="#e0705f"/>
  <rect x="80"  y="128" width="240" height="36" rx="3" fill="#d8a657"/>
  <rect x="80"  y="196" width="240" height="36" rx="3" fill="#83c167"/>
  <rect x="80"  y="264" width="240" height="36" rx="3" fill="#6fa8dc"/>
  <!-- connecting vertical lines between layers -->
  <line x1="200" y1="124" x2="200" y2="128" stroke="#8b8270" stroke-width="2"/>
  <line x1="200" y1="164" x2="200" y2="196" stroke="#8b8270" stroke-width="2"/>
  <line x1="200" y1="232" x2="200" y2="264" stroke="#8b8270" stroke-width="2"/>
  <!-- small connection dots -->
  <circle cx="200" cy="124" r="4" fill="#8b8270"/>
  <circle cx="200" cy="196" r="4" fill="#8b8270"/>
  <circle cx="200" cy="264" r="4" fill="#d8a657"/>
</svg>