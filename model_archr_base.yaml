model:
  name: archr Architecture Model
  elements:
    - id: e1
      name: Driver
      kind: Driver
    - id: e2
      name: Requirement
      kind: Requirement
    - id: e3
      name: Goal
      kind: Goal
    - id: e4
      name: Capability
      kind: Capability
    - id: e5
      name: BusinessActor
      kind: BusinessActor
    - id: e6
      name: ApplicationComponent
      kind: ApplicationComponent
    - id: e7
      name: WorkPackage
      kind: WorkPackage
    - id: e8
      name: Node
      kind: Node
  relationships:
    # Motivation
    - id: r1
      source: e1
      target: e2
      kind: Assignment
    - id: r2
      source: e2
      target: e3
      kind: Assignment
    # Strategy to Business
    - id: r3
      source: e4
      target: e5
      kind: Association
    # Business to Application
    - id: r4
      source: e5
      target: e6
      kind: Association
    # Application to Technology
    - id: r5
      source: e6
      target: e8
      kind: Access
    # Implementation to Application
    - id: r6
      source: e7
      target: e6
      kind: Realization
    # Technology to Application
    - id: r7
      source: e8
      target: e6
      kind: Serving
  viewpoints:
    - id: vp1
      name: Test Viewpoint
      kind: business
      elements:
        - id: e5
          name: BusinessActor
          kind: BusinessActor
        - id: e6
          name: ApplicationComponent
          kind: ApplicationComponent
      relationships:
        - id: r4
          source: e5
          target: e6
          kind: Association
