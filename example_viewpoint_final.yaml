model:
  name: "Business Viewpoint Model"
  elements:
    - id: "e1"
      name: "Customer Service"
      kind: "BusinessRole"
    - id: "e2"
      name: "Service Desk"
      kind: "BusinessService"
    - id: "e3"
      name: "Support Team"
      kind: "BusinessRole"
    - id: "e4"
      name: "Knowledge Base"
      kind: "BusinessService"
  relationships:
    - id: "r1"
      kind: "Assignment"
      source: "e1"
      target: "e2"
    - id: "r2"
      kind: "Assignment"
      source: "e3"
      target: "e4"
  viewpoints:
    - id: "vp1"
      name: "Customer Service Viewpoint"
      kind: "business"
      elements:
        - id: "e1"
        - id: "e2"
    - id: "vp2"
      name: "Support Operations Viewpoint"
      kind: "business"
      elements:
        - id: "e3"
        - id: "e4"
