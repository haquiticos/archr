name: Build & Test (Rust)

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Build workspace
        run: cargo build --workspace --release

      - name: Run tests
        run: cargo test --workspace

      - name: Regenerate SPEC.md from code
        run: python3 gen_spec.py

      - name: Verify SPEC.md is up to date
        run: |
          if [ -n "$(git diff docs/SPEC.md)" ]; then
            echo "❌ docs/SPEC.md is out of date! Run 'python3 gen_spec.py' to regenerate."
            git diff --stat docs/SPEC.md
            exit 1
          fi

      - name: Build release binary
        run: cargo build --release -p archr-core
