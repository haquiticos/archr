name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: archr-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: archr-windows-x86_64.exe
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: archr-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: archr-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Rename binary
        run: bash .github/workflows/rename.sh "${{ runner.os }}" "${{ matrix.artifact }}"
      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}
          generate_release_notes: true
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
