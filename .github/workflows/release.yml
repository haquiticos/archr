name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo
        uses: swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release -p archr-core
      - name: Rename binary
        run: cp target/release/archr archr-linux-x86_64
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: archr-linux-x86_64
          generate_release_notes: true
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
