name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    permissions:
      contents: write
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: archr-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: archr-windows-x86_64.exe
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: archr-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: archr-macos-arm64
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}
      - name: Verify target installed
        run: rustup target list | grep "${{ matrix.target }}"
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Rename binary
        run: bash .github/workflows/rename.sh "${{ runner.os }}" "${{ matrix.artifact }}" "target/${{ matrix.target }}"
      - uses: softprops/action-gh-release@v2
        with:
          files: target/${{ matrix.target }}/release/${{ matrix.artifact }}
          generate_release_notes: true
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}

  publish-crate:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify crate packages
        run: cargo publish -p archr-core --dry-run
      - name: Publish to crates.io
        run: cargo publish -p archr-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
