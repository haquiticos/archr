model:
  name: "Modelo com Múltiplos Viewpoints"
  elements:
    - id: "e1"
      name: "Cliente"
      kind: "BusinessActor"
    - id: "e2"
      name: "Servidor de Dados"
      kind: "ApplicationComponent"
    - id: "e3"
      name: "Aplicação CRM"
      kind: "ApplicationComponent"
  relationships:
    - id: "r1"
      kind: "Assignment"
      source: "e1"
      target: "e2"
    - id: "r2"
      kind: "Composition"
      source: "e2"
      target: "e3"
  viewpoints:
    - id: "vp1"
      name: "Viewpoint de Negócio"
      kind: "business"
      elements:
        - id: "e1"
          name: "Cliente"
          kind: "BusinessActor"
      relationships:
        - id: "r1"
          kind: "Assignment"
          source: "e1"
          target: "e2"
    - id: "vp2"
      name: "Viewpoint de Aplicação"
      kind: "application"
      elements:
        - id: "e2"
          name: "Servidor de Dados"
          kind: "ApplicationComponent"
        - id: "e3"
          name: "Aplicação CRM"
          kind: "ApplicationComponent"
      relationships:
        - id: "r2"
          kind: "Composition"
          source: "e2"
          target: "e3"
